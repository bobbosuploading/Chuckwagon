name: Deploy to Firebase

# Deploys the backend without needing a Mac. Start it by hand from the
# Actions tab (works from the GitHub phone app too). It never runs on its own.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "What to deploy"
        type: choice
        options: ["firestore,functions,hosting", "firestore,functions", "firestore", "functions", "hosting"]
        default: "firestore,functions,hosting"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
        working-directory: functions
      - name: Write Firebase credentials
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Write function settings
        # Optional: send-to-cart settings. Empty values just turn that feature off.
        working-directory: functions
        run: |
          {
            echo "KROGER_CLIENT_ID=$KROGER_CLIENT_ID"
            echo "KROGER_CLIENT_SECRET=$KROGER_CLIENT_SECRET"
            echo "INSTACART_API_KEY=$INSTACART_API_KEY"
            echo "INSTACART_API_URL=$INSTACART_API_URL"
            echo "APP_CHECK_ENFORCE=${APP_CHECK_ENFORCE:-false}"
            if [ -n "$APPLE_TEAM_ID" ]; then echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"; fi
          } > .env
        env:
          KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
          KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
          INSTACART_API_KEY: ${{ secrets.INSTACART_API_KEY }}
          INSTACART_API_URL: ${{ vars.INSTACART_API_URL }}
          # Repo variable: "true" makes the functions refuse calls from builds without App Check.
          APP_CHECK_ENFORCE: ${{ vars.APP_CHECK_ENFORCE }}
          # Repo variable: the Apple Team ID, so shared meal links open the app (universal links).
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      - name: Deploy
        run: npx --yes firebase-tools@14 deploy --project chuckwagon-ebbcc --only "${{ inputs.what }}" --non-interactive --force
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
