name: Collect H-E-B everyday prices

# Once a month (the 2nd, 6:45 AM CT) through Apify's free plan.
# Needs the APIFY_TOKEN secret; skips itself until it exists.
# Turn off before a paid launch by setting the repository variable HEB_PRICES_ENABLED to false.
on:
  schedule:
    - cron: "45 12 2 * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show the prices, don't save them"
        type: boolean
        default: true
      max_items:
        description: "Products to fetch (20 costs about 14 cents; 711 is the full monthly run)"
        default: "20"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Write Firebase credentials
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Collect
        run: node lib/cli-heb-prices.js
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          HEB_PRICES_ENABLED: ${{ vars.HEB_PRICES_ENABLED }}
          HOME_ZIP: "77437"
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
          MAX_ITEMS: ${{ github.event_name == 'workflow_dispatch' && inputs.max_items || '' }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
