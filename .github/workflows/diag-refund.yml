name: Give back failed plans (temporary)

on:
  push:
    branches: [claude/project-thread-5tg6t9]
    paths: [.github/workflows/diag-refund.yml]

jobs:
  refund:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Write credentials
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Give back today's failed plans
        run: cp ../.github/diag/refund.js refund-once.js && node refund-once.js
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
