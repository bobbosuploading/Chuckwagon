name: Test meal plan

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Claude model"
        type: choice
        options: [claude-haiku-5-5, claude-opus-5-5, claude-sonnet-5-5]
        default: claude-haiku-5-5
      meals:
        description: "Number of meals"
        default: "4"
      household:
        description: "Household size"
        default: "3"
      diet:
        description: "Diet (e.g. none, vegetarian, no pork)"
        default: "none"
      dislikes:
        description: "Dislikes"
        default: ""
      budget:
        description: "Budget in dollars (blank for none)"
        default: ""
      extra:
        description: "Extra meal ideas to pick from (0 to 3)"
        default: "2"
      store:
        description: "Store id (blank for the first store)"
        default: ""
      also_stores:
        description: "More store ids, comma-separated (optional)"
        default: ""
      include_meals:
        description: "Saved meals to build around, by name, separated by ; (optional)"
        default: ""
      theme:
        description: "Mood for every meal (e.g. Mexican, seafood, international) (optional)"
        default: ""
      night_themes:
        description: "Theme per meal, separated by ; with blanks for any (e.g. Mexican;;Seafood) (optional)"
        default: ""
      use_up:
        description: "Food at home to use up, separated by ; (e.g. 2 lb chicken thighs;half bag spinach) (optional)"
        default: ""
      on_hand:
        description: "Other food on hand, separated by ; (optional)"
        default: ""
      trip:
        description: "Store trip"
        type: choice
        options: [full, minimal, none]
        default: full
      cheapest:
        description: "Cheapest possible meals"
        type: boolean
        default: false
      long_cooks:
        description: "Long cooks (0 to 2)"
        default: "0"
      long_cook_how:
        description: "How long cooks are cooked"
        type: choice
        options: [any, smoker, slow cooker]
        default: any
      variants:
        description: "Compare thinking efforts, comma-separated: medium, low, high (blank = the app's setting only)"
        default: ""

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Write Firebase credentials
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Plan meals
        run: node lib/plan-cli.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          MODEL: ${{ inputs.model }}
          MEALS: ${{ inputs.meals }}
          HOUSEHOLD: ${{ inputs.household }}
          DIET: ${{ inputs.diet }}
          DISLIKES: ${{ inputs.dislikes }}
          BUDGET: ${{ inputs.budget }}
          EXTRA: ${{ inputs.extra }}
          STORE_ID: ${{ inputs.store }}
          STORE_IDS: ${{ inputs.also_stores }}
          VARIANTS: ${{ inputs.variants }}
          INCLUDE_MEALS: ${{ inputs.include_meals }}
          THEME: ${{ inputs.theme }}
          NIGHT_THEMES: ${{ inputs.night_themes }}
          USE_UP: ${{ inputs.use_up }}
          ON_HAND: ${{ inputs.on_hand }}
          TRIP: ${{ inputs.trip }}
          CHEAPEST: ${{ inputs.cheapest }}
          LONG_COOKS: ${{ inputs.long_cooks }}
          LONG_COOK_HOW: ${{ inputs.long_cook_how }}
