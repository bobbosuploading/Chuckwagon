name: Diagnose plan logs (temporary)

on:
  push:
    branches: [claude/project-thread-5tg6t9]
    paths: [.github/workflows/diag-plan-logs.yml]

jobs:
  logs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Write credentials
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Read logs
        run: |
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json"
          gcloud config set project chuckwagon-ebbcc
          echo "=== planmealsforstore warnings/errors, last 3h ==="
          gcloud logging read 'resource.labels.service_name="planmealsforstore" AND severity>=WARNING' --freshness=3h --limit=40 --format='value(timestamp,severity,textPayload,jsonPayload.message,jsonPayload)' || true
          echo "=== all planmealsforstore entries, last 3h (short) ==="
          gcloud logging read 'resource.labels.service_name="planmealsforstore"' --freshness=3h --limit=60 --format='value(timestamp,severity,textPayload,jsonPayload.message,httpRequest.status)' || true
          echo "=== any function errors, last 3h ==="
          gcloud logging read 'resource.type="cloud_run_revision" AND severity>=ERROR' --freshness=3h --limit=30 --format='value(timestamp,resource.labels.service_name,textPayload,jsonPayload.message)' || true
