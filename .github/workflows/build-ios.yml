name: Build iPhone app

# Compile check on GitHub's Macs, so nothing has to build on a personal computer.
on:
  push:
    paths: ["ios/**", "CHANGES.txt", "scripts/check-changes.sh", ".github/workflows/build-ios.yml"]
  workflow_dispatch:

jobs:
  changes-list:
    # CHANGES.txt must have a section for the build number in ios/project.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: scripts/check-changes.sh

  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen
      - name: Build (no signing)
        working-directory: ios
        run: |
          set -o pipefail
          # The real app and the dev app (same code, different bundle ID).
          for scheme in Chuckwagon ChuckwagonDev; do
            echo "== $scheme"
            xcodebuild -project Chuckwagon.xcodeproj -scheme "$scheme" \
              -destination 'generic/platform=iOS Simulator' \
              -skipPackagePluginValidation -skipMacroValidation \
              CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "build-$scheme.log" | grep -E "error:|warning: .*Chuckwagon/|BUILD (SUCCEEDED|FAILED)" || true
            grep -q "BUILD SUCCEEDED" "build-$scheme.log"
          done
