name: Pricing branch test (temporary)

# Temporary: tests the pricing work on its branch before the PR merges. Delete before merging.
on:
  push:
    branches: [claude/project-thread-3lcmbt]
    paths: [functions/**, .github/workflows/pricing-branch-test.yml]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Write Firebase credentials
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: ALDI and Dollar General ads (dry run)
        run: node lib/cli-ads.js
        continue-on-error: true
        env:
          HOME_ZIP: "77437"
          DRY_RUN: "1"
      - name: Kroger deals and price books (same as the scheduled run, plus price books)
        run: node lib/cli.js
        env:
          KROGER_CLIENT_ID: ${{ secrets.KROGER_CLIENT_ID }}
          KROGER_CLIENT_SECRET: ${{ secrets.KROGER_CLIENT_SECRET }}
          HOME_ZIP: "77437"
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
      - name: Find a Kroger store
        id: store
        run: |
          node -e '
            const {initializeApp}=require("firebase-admin/app");const {getFirestore}=require("firebase-admin/firestore");
            initializeApp();getFirestore().collection("priceBooks").limit(1).get().then(s=>{
              const d=s.docs[0];console.log("book",d.id,(d.get("items")||[]).length,"items");
              require("fs").appendFileSync(process.env.GITHUB_OUTPUT,"kroger="+d.id+"\n");});'
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
      - name: Plan meals at Kroger (store prices)
        run: node lib/plan-cli.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          STORE_ID: ${{ steps.store.outputs.kroger }}
      - name: Plan meals at H-E-B (estimated prices)
        run: node lib/plan-cli.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
          STORE_ID: heb-77437
