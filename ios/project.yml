# Generate the Xcode project with XcodeGen:  brew install xcodegen && cd ios && xcodegen
name: Chuckwagon
options:
  bundleIdPrefix: com.bobby
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"
targets:
  Chuckwagon:
    type: application
    platform: iOS
    sources:
      - Chuckwagon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bobby.chuckwagon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Chuckwagon
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    scheme: {}
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
